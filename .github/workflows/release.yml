name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Vet and test
        run: |
          go vet ./...
          go test -race ./...

      - name: Cross-compile release archives
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          VER="${TAG#v}"
          rm -rf release
          mkdir -p release
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            stage="$(mktemp -d)"
            bin="depbrief"
            if [ "$os" = "windows" ]; then
              bin="depbrief.exe"
            fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath -ldflags="-s -w -X main.version=${TAG}" \
              -o "$stage/$bin" ./cmd/depbrief
            cp README.md LICENSE "$stage/"
            if [ "$os" = "windows" ]; then
              (cd "$stage" && zip -q "$GITHUB_WORKSPACE/release/depbrief_${VER}_${os}_${arch}.zip" "$bin" README.md LICENSE)
            else
              tar -C "$stage" -czf "release/depbrief_${VER}_${os}_${arch}.tar.gz" "$bin" README.md LICENSE
            fi
            rm -rf "$stage"
          done
          (cd release && sha256sum * > checksums.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "Release $TAG"
          fi
          gh release upload "$TAG" release/* --clobber
